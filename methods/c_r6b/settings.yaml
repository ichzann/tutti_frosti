# c_r6b settings: spectral unmixing + elastic registration of the fraction season course.
# Endmembers (10-band reflectance B02..B12), label-free: medians of pooled dev pixel spectra (400 px / field, usable
# dates) with rules fixed before any score: GV = NDVI top 1 %; SOIL = NDVI < 0.25 and NDTI (B11-B12)/(B11+B12)
# bottom 5 %; NPV = NDVI < 0.25 and NDTI top 5 %; SHADE = zero spectrum.
endmember_gv:    [0.014, 0.035, 0.013, 0.060, 0.318, 0.449, 0.467, 0.464, 0.132, 0.056]
endmember_npv:   [0.088, 0.125, 0.188, 0.225, 0.248, 0.272, 0.285, 0.308, 0.342, 0.225]
endmember_soil:  [0.050, 0.067, 0.108, 0.127, 0.138, 0.148, 0.152, 0.160, 0.237, 0.215]
min_sunlit: 0.05         # fractions are shade-normalised; pixel-date dropped if 1 - shade < this (set before scoring)
usable_share: 0.5        # date used if scene usable and >= this share of outline pixels clear (from c_r1a)
min_clear_dates: 3       # pixel needs this many clear usable dates, else NaN (from c_r1a)
refl_floor: 0.001        # floor before ln of bands (from c_r2b)
grid_start_doy: 90       # grid doy 90..322, 8 d (from c_r4b, not varied)
grid_end_doy: 330
grid_step_days: 8
dtw_band: 4              # CHOSEN ON DEV: Sakoe-Chiba band of the registration (grid steps); screened 3/4/6/8/10 (README)
register_on: [gv, npv, soil]          # CHOSEN ON DEV: channels that define the warp (screens: gv only / fractions / all)
amplitude_channels: [gv, npv, soil, ln_bands]   # CHOSEN ON DEV: channels read on the template axis
alpha_grid: [3000, 10000, 30000]      # CHOSEN ON DEV (range from screens); alpha picked by inner leave-one-year-out C
train_pixels: 400        # pixels per training field for its mean registered features (speed; seed 0)
none_target: 0.15        # target for no-claim fields (from c_r1a)
heavy_nan_target: 0.85   # target for paid fields with unknown loss (from c_r1a)
pixel_chunk: 2000        # pixels per registration block (memory only)
