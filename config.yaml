# All thresholds are initial proposals (Phase 1). Do not tune in this phase.
study:
  county_fips: "16011"          # Bingham County, ID (confirmed at step 0 for 2024). 2022 Teton run: no trigger night inside any growth phase (emergence ~Jul 1-9)
  candidate_counties: {Bingham: "16011", Jefferson: "16051", Bonneville: "16019"}
  year: 2024                    # widespread potato frost Jun 18-19, 2024 (station records + news)
  season_start: "2024-05-01"
  season_end: "2024-09-30"
  timezone: "America/Denver"

paths:
  cache: "cache"                # small preprocessed inputs (never raw GRIB)
  runs: "runs"

data:
  cdl_potato_class: 43
  cdl_min_confidence: 75        # percent
  csb_release: "NationalCSB_2018-2025_rev23"
  csb_inward_buffer_m: 10
  min_field_area_ha: 4.0
  s2_collection: "sentinel-2-l2a"
  s2_clear_scl: [4, 5]          # 4 = vegetation, 5 = bare soil (not vegetated)
  s2_resolution_m: 10
  dem_collection: "3dep-seamless"
  dem_gsd_m: 10
  work_crs: "EPSG:32612"        # UTM 12N

night:
  frost_threshold_c: 1.0        # trigger: min TMP <= this; also dose base
  wind_mean_max_ms: 2.5
  gust_max_ms: 6.0              # no hourly gust > this
  cloud_mean_max_pct: 30.0
  dewpoint_sunset_max_c: 5.0
  near_trigger_tmin_c: [4.0, 10.0]

growth:
  emergence_evi2: 0.20
  smoothing_window_obs: 3       # simple rule: centered running median (3 clear obs) of field-median EVI2

gpr:
  min_clear_obs_since_emergence: 4
  max_gap_before_days: 20
  max_gap_after_days: 10

damage:
  z_damaged: -2.0
  # simple default (brief leaves the kernel open): constant * RBF + white noise,
  # hyperparameters fitted per pixel by sklearn's marginal likelihood
  kernel: "rbf_white"
  length_scale_init_days: 20.0
